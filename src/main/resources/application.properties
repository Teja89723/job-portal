spring.application.name=Job Portal

# ==========================================================================
# Database Configuration
# ==========================================================================
# Local development:
#   Database : careerhub
#   Username : careerhub
#   Password : careerhub
#
# For deployment, SPRING_DATASOURCE_* environment variables can override
# these local defaults automatically.
# ==========================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/careerhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:careerhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:careerhub}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================================
# Hikari Connection Pool
# ==========================================================================

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=10000

# ==========================================================================
# JPA / Hibernate Configuration
# ==========================================================================

spring.jpa.database=MYSQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================================
# Logging
# ==========================================================================

logging.level.org.springframework.security=INFO
logging.level.com.jobportal=DEBUG

# ==========================================================================
# Server Port
# ==========================================================================

server.port=${PORT:8080}

# ==========================================================================
# Email / SMTP Configuration
# ==========================================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true