<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>CareerHub - Dashboard</title>

    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="CareerHub Job Portal">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS -->
    <link rel="stylesheet"
          type="text/css"
          media="all"
          th:href="@{/css/styles.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/font-awesome/css/all.css}">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="navbar navbar-expand-lg navbar-dark">

    <!-- Logo -->
    <label class="mt-2 ms-5 font-weight-bold h5">
        <a href="/" style="text-decoration: none;">
            CareerHub
        </a>

        <span class="logo_com font-weight-bold h5"
              style="color: white;">
            .com
        </span>
    </label>

    <!-- Mobile Menu Button -->
    <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

    </button>

    <!-- Navigation -->
    <div class="collapse navbar-collapse" id="navbarToggler">

        <ul class="navbar-nav m-auto mt-2 mt-lg-0">

            <!-- ================= JOB SEEKER MENU ================= -->

            <li class="nav-item active"
                sec:authorize="hasAuthority('Job Seeker')">

                <a class="nav-link"
                   th:href="@{/dashboard/}">

                    <i class="fas fa-search"></i>
                    Search for Jobs

                </a>

            </li>

            <li class="nav-item"
                sec:authorize="hasAuthority('Job Seeker')">

                <a class="nav-link"
                   th:href="@{/saved-jobs/}">

                    <i class="fa-solid fa-eye"></i>
                    View Saved Jobs

                </a>

            </li>

            <li class="nav-item"
                sec:authorize="hasAuthority('Job Seeker')">

                <a class="nav-link"
                   th:href="@{/job-seeker-profile/}">

                    <i class="fa-solid fa-pencil"></i>
                    Edit Profile

                </a>

            </li>

            <!-- ================= RECRUITER MENU ================= -->

            <li class="nav-item"
                sec:authorize="hasAuthority('Recruiter')">

                <a class="nav-link"
                   th:href="@{/dashboard/add}">

                    <i class="fa-solid fa-file-circle-plus"></i>
                    Post New Job

                </a>

            </li>

            <li class="nav-item active"
                sec:authorize="hasAuthority('Recruiter')">

                <a class="nav-link"
                   th:href="@{/dashboard/}">

                    <i class="fa-solid fa-eye"></i>
                    View Your Jobs

                </a>

            </li>

            <li class="nav-item"
                sec:authorize="hasAuthority('Recruiter')">

                <a class="nav-link"
                   th:href="@{/recruiter-profile/}">

                    <i class="fa-solid fa-pencil"></i>
                    Edit Account

                </a>

            </li>

        </ul>

        <!-- ================= USER PHOTO ================= -->

        <img
                class="rounded-circle me-3"
                height="50"
                width="50"
                alt="Profile Photo"
                th:if="${user != null and user.photosImagePath != null}"
                th:src="@{${user.photosImagePath}}" />

        <!-- ================= USER NAME ================= -->

        <label
                class="nav-item nav-link px-2 me-3"
                th:text="${user != null and user.firstName != null and user.lastName != null
                    ? user.firstName + ' ' + user.lastName
                    : username}">
        </label>

        <!-- ================= LOGOUT ================= -->

        <button
                class="myBtn-light me-5"
                type="button"
                onclick="window.location.href='/logout'">

            Logout

        </button>

    </div>

</header>

<!-- ================= MAIN SECTION ================= -->

<section class="section">

    <!-- Side Navigation -->
    <div class="sidenav px-5">
    </div>

    <!-- Main Content -->
    <article>

        <!-- ================= RECRUITER DASHBOARD TITLE ================= -->

        <div
                class="box"
                sec:authorize="hasAuthority('Recruiter')">

            <h1 class="primary-title">
                Recruiter Dashboard
            </h1>

        </div>

        <!-- ================= JOB RESULTS ================= -->

        <div class="box mt-3">

            <!-- ================================================= -->
            <!-- JOB SEEKER SEARCH ENGINE                          -->
            <!-- ================================================= -->

            <form
                    id="jobSearchForm"
                    th:action="@{/dashboard/}"
                    method="get"
                    sec:authorize="hasAuthority('Job Seeker')"
                    class="mb-4">

                <div class="row g-2 align-items-center">

                    <!-- Keyword -->

                    <div class="col-md-5">

                        <input
                                type="text"
                                class="form-control"
                                name="job"
                                placeholder="Job title, skills or company"
                                th:value="${job}">

                    </div>

                    <!-- Location -->

                    <div class="col-md-5">

                        <input
                                type="text"
                                class="form-control"
                                name="location"
                                placeholder="City, state or remote"
                                th:value="${location}">

                    </div>

                    <!-- Search Button -->

                    <div class="col-md-2">

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            <i class="fas fa-search"></i>
                            Search

                        </button>

                    </div>

                </div>

            </form>

            <!-- ================= SEARCH STATUS ================= -->

            <div
                    class="mb-3 px-3"
                    sec:authorize="hasAuthority('Job Seeker')">

                <span
                        th:if="${job != null and !#strings.isEmpty(job)}"
                        th:text="'Results for: ' + ${job}">
                </span>

                <span
                        th:if="${location != null and !#strings.isEmpty(location)}"
                        th:text="' in ' + ${location}">
                </span>

            </div>

            <!-- ================= JOB SEEKER TITLE ================= -->

            <label
                    class="large-label px-3 mb-3"
                    sec:authorize="hasAuthority('Job Seeker')">

                Search Results

            </label>

            <!-- ================= JOB LIST ================= -->

            <th:block th:each="jobPost : ${jobPost}">

                <!-- Job Details Link -->

                <a
                        th:href="@{/job-details-apply/{id}(id=${jobPost.jobPostId})}"
                        style="text-decoration: none; color: black;">

                    <div class="job-row">

                        <div class="row">

                            <!-- ================= JOB TITLE ================= -->

                            <div class="col-md-4">

                                <label class="job-title text-left">

                                    <span
                                            th:text="${jobPost.jobTitle}">

                                        Job Title

                                    </span>

                                    <!-- Recruiter: Candidates Applied -->

                                    <span
                                            class="title-span"
                                            sec:authorize="hasAuthority('Recruiter')"
                                            th:text="|(${jobPost.totalCandidates} Candidates Applied)|">

                                        (0 Candidates Applied)

                                    </span>

                                    <!-- Job Seeker: Applied -->

                                    <span
                                            class="title-span"
                                            sec:authorize="hasAuthority('Job Seeker')"
                                            th:if="${jobPost.isActive == true}">

                                        (Applied)

                                    </span>

                                    <!-- Job Seeker: Saved -->

                                    <span
                                            class="title-span"
                                            sec:authorize="hasAuthority('Job Seeker')"
                                            th:if="${jobPost.isSaved == true}">

                                        (Saved)

                                    </span>

                                </label>

                            </div>

                            <!-- ================= LOCATION ================= -->

                            <div class="col-md-4 text-center">

                                <label
                                        th:text="${jobPost.jobLocation != null
                                            ? jobPost.jobLocation.city + ', ' + jobPost.jobLocation.state
                                            : 'Location not available'}">

                                    City, State

                                </label>

                            </div>

                            <!-- ================= JOB TYPE ================= -->

                            <div class="col-md-4 text-center">

                                <label>
                                    Job Type
                                </label>

                            </div>

                        </div>

                    </div>

                </a>

            </th:block>

        </div>

    </article>

</section>

<!-- ================= JAVASCRIPT ================= -->

<script
        type="text/javascript"
        th:src="@{/webjars/jquery/jquery.min.js}">
</script>

<script
        type="text/javascript"
        th:src="@{/webjars/bootstrap/js/bootstrap.min.js}">
</script>

</body>

</html>
