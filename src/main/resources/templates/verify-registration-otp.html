<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">

    <title>Verify Email - CareerHub</title>

    <link
        th:rel="stylesheet"
        th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
    />

    <link
        rel="stylesheet"
        type="text/css"
        th:href="@{/css/font-awesome.min.css}"
    />

    <link
        rel="stylesheet"
        type="text/css"
        th:href="@{/css/styles.css}"
    />

    <link
        href="https://fonts.googleapis.com/css?family=Montserrat"
        rel="stylesheet"
    />
</head>

<body>

<section class="content hidden-overflow">

    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-6 Job-portal-register">

            <div class="logo_left mt-3 pt-4 ms-5 pl-5">

                <h2 class="logo" style="color: white;">
                    CareerHub
                    <span class="logo_com">.com</span>
                </h2>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="col-6">

            <div class="top-margin">

                <div>

                    <div class="d-flex justify-content-center mb-4">

                        <h1 class="heading_font font-weight-bold">
                            Verify Your Email
                        </h1>

                    </div>


                    <div class="myForm">

                        <!-- SUCCESS MESSAGE -->
                        <div
                            th:if="${message}"
                            class="alert alert-success"
                            th:text="${message}">
                        </div>


                        <!-- ERROR MESSAGE -->
                        <div
                            th:if="${error}"
                            class="alert alert-danger"
                            th:text="${error}">
                        </div>


                        <form
                            th:action="@{/verify-registration-otp}"
                            method="post">

                            <div class="box-body bozero mx2p">

                                <!-- EMAIL -->
                                <div class="row">

                                    <div class="col-md-12">

                                        <div class="form-group">

                                            <label
                                                for="email"
                                                class="form-label">
                                                Email Address
                                            </label>

                                            <input
                                                id="email"
                                                type="email"
                                                name="email"
                                                class="form-control"
                                                th:value="${email}"
                                                readonly
                                                required
                                            />

                                        </div>

                                    </div>

                                </div>


                                <!-- OTP -->
                                <div class="row">

                                    <div class="col-md-12">

                                        <div class="form-group">

                                            <label
                                                for="otp"
                                                class="form-label">
                                                Enter OTP
                                            </label>

                                            <input
                                                id="otp"
                                                type="text"
                                                name="otp"
                                                class="form-control"
                                                placeholder="Enter 6-digit OTP"
                                                maxlength="6"
                                                inputmode="numeric"
                                                autocomplete="one-time-code"
                                                required
                                            />

                                            <small class="text-muted">
                                                Enter the 6-digit OTP sent to your email.
                                                The OTP is valid for 10 minutes.
                                            </small>

                                        </div>

                                    </div>

                                </div>

                            </div>


                            <!-- BUTTON -->
                            <div class="box-footer">

                                <div class="row">

                                    <div class="form-group mt-4 col-md-12">

                                        <button
                                            type="submit"
                                            class="myBtn py-3">
                                            Verify Email
                                        </button>

                                    </div>

                                </div>

                            </div>

                        </form>


                        <!-- BACK TO REGISTER -->
                        <div class="text-center mt-3">

                            <a
                                th:href="@{/register}"
                                class="color-text">
                                Back to Registration
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script
    type="text/javascript"
    th:src="@{/webjars/jquery/jquery.min.js}">
</script>

<script
    type="text/javascript"
    th:src="@{/webjars/bootstrap/js/bootstrap.min.js}">
</script>

</body>

</html>
