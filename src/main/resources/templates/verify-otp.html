<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - CareerHub</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .otp-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .otp-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .otp-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .otp-description {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .email-display {
            text-align: center;
            font-weight: 600;
            color: #212529;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .form-control {
            height: 52px;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 6px;
        }

        .btn-verify {
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="otp-card">

    <!-- Icon -->
    <div class="otp-icon">
        <i class="fas fa-shield-halved"></i>
    </div>

    <!-- Heading -->
    <h2 class="otp-title">
        Verify OTP
    </h2>

    <p class="otp-description">
        Enter the 6-digit OTP sent to your registered email address.
    </p>

    <!-- Email -->
    <div class="email-display">

        <i class="fas fa-envelope me-2"></i>

        <span th:text="${email}">
            your@email.com
        </span>

    </div>

    <!-- Error -->
    <div
            th:if="${error}"
            class="alert alert-danger"
            role="alert">

        <i class="fas fa-circle-exclamation me-2"></i>

        <span th:text="${error}">
            Invalid OTP
        </span>

    </div>

    <!-- OTP Form -->
    <form
            th:action="@{/verify-otp}"
            method="post">

        <!-- Email -->
        <input
                type="hidden"
                name="email"
                th:value="${email}">

        <div class="mb-4">

            <label
                    for="otp"
                    class="form-label fw-semibold">

                One-Time Password

            </label>

            <input
                    id="otp"
                    name="otp"
                    type="text"
                    class="form-control"
                    placeholder="000000"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required>

        </div>

        <button
                type="submit"
                class="btn btn-primary btn-verify w-100">

            <i class="fas fa-check-circle me-2"></i>

            Verify OTP

        </button>

    </form>

    <!-- Back -->
    <div class="back-link">

        <a th:href="@{/forgot-password}">

            <i class="fas fa-arrow-left me-2"></i>

            Request New OTP

        </a>

    </div>

</div>

<script>

    const otpInput = document.getElementById("otp");

    otpInput.addEventListener("input", function () {

        this.value = this.value.replace(/[^0-9]/g, "");

    });

</script>

</body>

</html>
