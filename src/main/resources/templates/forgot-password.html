<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CareerHub</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .forgot-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .forgot-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .forgot-description {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
        }

        .btn-send {
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="forgot-card">

    <!-- Icon -->
    <div class="logo-icon">
        <i class="fas fa-lock"></i>
    </div>

    <!-- Heading -->
    <h2 class="forgot-title">
        Forgot Password?
    </h2>

    <p class="forgot-description">
        Enter your registered email address and we will
        send you a one-time password (OTP).
    </p>

    <!-- Error Message -->
    <div
            th:if="${error}"
            class="alert alert-danger"
            role="alert">

        <i class="fas fa-circle-exclamation me-2"></i>

        <span th:text="${error}">
            Error message
        </span>

    </div>

    <!-- Success Message -->
    <div
            th:if="${message}"
            class="alert alert-success"
            role="alert">

        <i class="fas fa-circle-check me-2"></i>

        <span th:text="${message}">
            Success message
        </span>

    </div>

    <!-- Forgot Password Form -->
    <form
            th:action="@{/forgot-password/send-otp}"
            method="post">

        <div class="mb-3">

            <label
                    for="email"
                    class="form-label fw-semibold">

                Email Address

            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                </span>

                <input
                        id="email"
                        name="email"
                        type="email"
                        class="form-control"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required>

            </div>

        </div>

        <button
                type="submit"
                class="btn btn-primary btn-send w-100">

            <i class="fas fa-paper-plane me-2"></i>

            Send OTP

        </button>

    </form>

    <!-- Back to Login -->
    <div class="back-login">

        <a th:href="@{/login}">

            <i class="fas fa-arrow-left me-2"></i>

            Back to Login

        </a>

    </div>

</div>

</body>

</html>
