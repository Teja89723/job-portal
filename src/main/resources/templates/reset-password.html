<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CareerHub</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .reset-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .reset-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .reset-description {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6c757d;
            cursor: pointer;
            font-size: 18px;
        }

        .password-toggle:hover {
            color: #0d6efd;
        }

        .btn-reset {
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
        }

        .email-display {
            text-align: center;
            color: #495057;
            font-size: 14px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .alert {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="reset-card">

    <!-- Icon -->
    <div class="reset-icon">
        <i class="fas fa-key"></i>
    </div>

    <!-- Heading -->
    <h2 class="reset-title">
        Reset Password
    </h2>

    <p class="reset-description">
        Create a new password for your CareerHub account.
    </p>

    <!-- Email -->
    <div class="email-display">

        <i class="fas fa-envelope me-2"></i>

        <span th:text="${email}">
            your@email.com
        </span>

    </div>

    <!-- Error Message -->
    <div
            th:if="${error}"
            class="alert alert-danger"
            role="alert">

        <i class="fas fa-circle-exclamation me-2"></i>

        <span th:text="${error}">
            Error message
        </span>

    </div>

    <!-- Reset Password Form -->
    <form
            th:action="@{/reset-password}"
            method="post">

        <!-- Hidden Email -->
        <input
                type="hidden"
                name="email"
                th:value="${email}">

        <!-- Hidden OTP -->
        <input
                type="hidden"
                name="otp"
                th:value="${otp}">

        <!-- New Password -->
        <div class="mb-3">

            <label
                    for="newPassword"
                    class="form-label fw-semibold">

                New Password

            </label>

            <div class="password-wrapper">

                <input
                        id="newPassword"
                        name="newPassword"
                        type="password"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('newPassword', 'newPasswordIcon')"
                        aria-label="Show password">

                    <i
                            id="newPasswordIcon"
                            class="fas fa-eye">
                    </i>

                </button>

            </div>

            <small class="text-muted">
                Password must contain at least 8 characters.
            </small>

        </div>

        <!-- Confirm Password -->
        <div class="mb-4">

            <label
                    for="confirmPassword"
                    class="form-label fw-semibold">

                Confirm Password

            </label>

            <div class="password-wrapper">

                <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        class="form-control"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')"
                        aria-label="Show password">

                    <i
                            id="confirmPasswordIcon"
                            class="fas fa-eye">
                    </i>

                </button>

            </div>

        </div>

        <!-- Reset Button -->
        <button
                type="submit"
                class="btn btn-primary btn-reset w-100">

            <i class="fas fa-lock me-2"></i>

            Reset Password

        </button>

    </form>

</div>

<script>

    function togglePassword(passwordId, iconId) {

        const passwordField =
            document.getElementById(passwordId);

        const icon =
            document.getElementById(iconId);

        if (passwordField.type === "password") {

            passwordField.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            passwordField.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

</script>

</body>

</html>
